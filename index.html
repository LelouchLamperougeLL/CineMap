<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumière</title>
<meta name="description" content="A map of a private film collection, where every film sits beside the films it most resembles.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c1428">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1428'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23f1e8d4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root {
  --night: #0c1428;
  --night-2: #121d38;
  --night-3: #1a2747;
  --glass: rgba(11, 18, 36, 0.76);
  --glass-strong: rgba(9, 15, 30, 0.93);
  --line: rgba(241, 232, 212, 0.12);
  --line-strong: rgba(241, 232, 212, 0.26);
  --vellum: #f1e8d4;
  --dust: #a2abc2;
  --faint: #6f7994;
  --brass: #d8b46a;
  --serif: 'Cormorant', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Sofia Sans Semi Condensed', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--vellum);
  font: 400 15px/1.5 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- the map ---------- */
html { background: radial-gradient(130% 95% at 50% 42%, #142243 0%, #0c1428 52%, #060b18 100%) fixed; }
body { background: transparent; }
.stars {
  position: fixed; inset: -640px; pointer-events: none;
  background-repeat: repeat; will-change: transform; opacity: 0.9;
}
#map {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; cursor: grab;
}
#map.is-dragging { cursor: grabbing; }
#map.is-pointing { cursor: pointer; }
.veil {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 58%, rgba(3, 6, 14, 0.6) 100%);
}

/* ---------- title ---------- */
.brand {
  position: fixed; top: 18px; left: 26px; z-index: 5;
  max-width: min(46vw, 560px);
  pointer-events: none;
  transition: opacity .6s var(--ease), transform .6s var(--ease);
}
.brand__title {
  margin: 0;
  font: 600 clamp(34px, 4.4vw, 54px)/0.95 var(--serif);
  letter-spacing: 0.005em;
  text-shadow: 0 0 28px rgba(241, 232, 212, 0.28), 0 0 2px rgba(241, 232, 212, 0.4);
}
.brand__line {
  margin: 10px 0 0;
  max-width: 36ch;
  color: var(--dust);
  font-size: 15px;
  line-height: 1.4;
}
.brand__count { color: var(--vellum); font-weight: 600; }
body.intro .brand { opacity: 0; transform: translateY(-6px); }

/* ---------- search ---------- */
.search {
  position: fixed; top: 18px; right: 22px; z-index: 30;
  width: min(390px, calc(100vw - 44px));
}
.search__box {
  display: flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 12px 0 14px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 13px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  transition: border-color .2s;
}
.search__box:focus-within { border-color: var(--line-strong); }
.search__box svg { color: var(--dust); }
.search input {
  flex: 1; min-width: 0; height: 100%;
  background: none; border: 0; outline: none;
  font-size: 16px; letter-spacing: 0.01em;
}
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd {
  font: 600 12px/1 var(--sans); color: var(--faint);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px;
}
.results {
  margin-top: 8px; max-height: min(70vh, 560px); overflow: auto;
  background: var(--glass-strong);
  border: 1px solid var(--line); border-radius: 13px;
  padding: 6px;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
}
.results__group { margin: 8px 10px 4px; font: italic 500 16px/1.2 var(--serif); color: var(--dust); }
.result {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 7px 10px; border-radius: 9px; text-align: left;
}
.result[aria-selected="true"], .result:hover { background: rgba(241, 232, 212, 0.08); }
.result__img { width: 30px; height: 45px; border-radius: 3px; object-fit: cover; background: var(--night-3); flex: none; }
.result__dot { width: 30px; height: 30px; flex: none; display: grid; place-items: center; color: var(--dust); }
.result__text { min-width: 0; }
.result__title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result__meta { display: block; color: var(--dust); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results__empty { padding: 14px; color: var(--dust); }

/* ---------- banner (spotlight, path, filters) ---------- */
.banner {
  position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  max-width: min(560px, calc(100vw - 32px));
  padding: 8px 8px 8px 16px;
  background: var(--glass-strong);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
.banner[hidden] { display: none; }
.banner__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner__text b { font-weight: 600; }
.banner__swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.btn-quiet {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  color: var(--vellum); background: rgba(241, 232, 212, 0.08);
  font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn-quiet:hover { background: rgba(241, 232, 212, 0.16); }

/* ---------- bottom bar: dock, years, tools ---------- */
.bottombar {
  position: fixed; left: 22px; right: 22px; bottom: calc(18px + var(--safe-b)); z-index: 10;
  display: flex; align-items: flex-end; gap: 16px;
  pointer-events: none;
}
.bottombar > * { pointer-events: auto; }
@media (min-width: 761px) {
  .bottombar { transition: left .5s var(--ease), right .5s var(--ease); }
  body.detail-open .bottombar { right: calc(min(460px, 100vw - 24px) + 28px); }
  body.drawer-open .bottombar { left: calc(min(400px, 100vw - 24px) + 28px); }
  body.detail-open.drawer-open .timeline { display: none; }
}
.dock, .tools {
  display: flex; gap: 2px; padding: 5px; flex: none;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 15px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.dock button, .tools button {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 13px; border-radius: 11px;
  color: var(--dust); font-weight: 500; font-size: 15px; letter-spacing: 0.01em;
  transition: color .2s, background .2s;
}
.tools button { width: 40px; padding: 0; justify-content: center; }
.dock button:hover, .tools button:hover { color: var(--vellum); background: rgba(241, 232, 212, 0.07); }
.dock button[aria-pressed="true"] { color: var(--vellum); background: rgba(241, 232, 212, 0.11); }
.dock__badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--brass); color: #1b1407; font: 700 11px/18px var(--sans); text-align: center;
}
.dock__badge[hidden] { display: none; }

/* ---------- timeline ---------- */
.timeline {
  flex: 1 1 auto; min-width: 0; max-width: 560px; margin: 0 auto;
  padding: 8px 12px 6px;
  background: var(--glass);
  border: 1px solid var(--line); border-radius: 15px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.years { position: relative; height: 38px; }
.years canvas { position: absolute; inset: 0 0 auto 0; width: 100%; height: 30px; display: block; }
.years input[type=range] {
  position: absolute; left: -7px; right: -7px; top: 18px; width: calc(100% + 14px); margin: 0;
  -webkit-appearance: none; appearance: none; background: none; pointer-events: none; height: 22px;
}
.years input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; width: 14px; height: 22px; border-radius: 5px;
  background: var(--vellum); border: 3px solid var(--night); cursor: ew-resize;
}
.years input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 10px; height: 18px; border-radius: 5px;
  background: var(--vellum); border: 3px solid var(--night); cursor: ew-resize;
}
.years input[type=range]::-webkit-slider-runnable-track { background: none; }
.years__labels { display: flex; justify-content: space-between; color: var(--dust); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.years__labels b { color: var(--vellum); font-weight: 600; }

/* ---------- side panels ---------- */
.panel {
  position: fixed; top: 12px; bottom: 12px; z-index: 40;
  display: flex; flex-direction: column;
  background: var(--glass-strong);
  border: 1px solid var(--line);
  border-radius: 20px;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  overflow: hidden;
  visibility: hidden;
  transition: transform .5s var(--ease), visibility 0s linear .5s;
}
.panel.is-open { visibility: visible; transform: none; transition: transform .5s var(--ease), visibility 0s; }
.detail { right: 12px; width: min(460px, calc(100vw - 24px)); transform: translateX(calc(100% + 24px)); }
.drawer { left: 12px; width: min(400px, calc(100vw - 24px)); transform: translateX(calc(-100% - 24px)); }
.panel__close {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  color: var(--vellum); background: rgba(9, 15, 30, 0.6);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.panel__close:hover { background: rgba(241, 232, 212, 0.14); }
.panel__scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(241,232,212,.2) transparent; }
.panel__grip { display: none; }

/* ---------- film detail ---------- */
.film__hero { position: relative; min-height: 120px; }
.film__backdrop {
  position: absolute; inset: 0 0 auto 0; height: 250px;
  background-size: cover; background-position: center 25%;
  opacity: 0; transition: opacity .8s;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 55%, transparent 100%);
          mask-image: linear-gradient(to bottom, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 55%, transparent 100%);
}
.film__backdrop.is-loaded { opacity: 0.55; }
.film__head { position: relative; display: flex; gap: 18px; align-items: flex-end; padding: 96px 24px 0; }
.film__poster {
  width: 112px; aspect-ratio: 2 / 3; flex: none; border-radius: 6px; object-fit: cover;
  background: var(--night-3);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(241, 232, 212, 0.12);
}
.film__titles { min-width: 0; padding-bottom: 4px; }
.film__title { margin: 0; font: 600 34px/1.02 var(--serif); letter-spacing: 0.003em; overflow-wrap: anywhere; }
.film__original { margin: 6px 0 0; font: italic 500 19px/1.2 var(--serif); color: var(--dust); overflow-wrap: anywhere; }
.film__original.is-script { font-style: normal; font-size: 17px; letter-spacing: 0.04em; }
.film__facts {
  display: flex; flex-wrap: wrap; gap: 4px 0; margin: 18px 24px 0; padding: 0; list-style: none;
  font-weight: 500; font-size: 14px; letter-spacing: 0.04em; color: var(--dust); font-variant-numeric: tabular-nums;
}
.film__facts li { padding: 0 12px; border-left: 1px solid var(--line-strong); }
.film__facts li:first-child { padding-left: 0; border-left: 0; }
.film__credit { margin: 14px 24px 0; font-size: 16px; }
.film__credit span { color: var(--dust); }
.film__tagline { margin: 18px 24px 0; font: italic 500 21px/1.3 var(--serif); color: var(--vellum); }
.film__overview { margin: 12px 24px 0; font-size: 16px; line-height: 1.6; color: #ddd6c6; max-width: 62ch; }
.film__actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 24px 0; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: rgba(241, 232, 212, 0.04);
  color: var(--vellum); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
  transition: background .2s, border-color .2s;
}
.chip:hover { background: rgba(241, 232, 212, 0.1); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: rgba(216, 180, 106, 0.18); border-color: rgba(216, 180, 106, 0.6); }
.chip svg.i { width: 15px; height: 15px; }
.swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
.section { margin: 30px 24px 0; }
.section__title { margin: 0 0 10px; font: italic 500 23px/1.15 var(--serif); color: var(--vellum); }
.section__note { margin: -4px 0 12px; color: var(--dust); font-size: 14px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 7px 14px; margin: 0; font-size: 15px; }
.kv dt { color: var(--dust); }
.kv dd { margin: 0; }
.person { color: var(--vellum); text-decoration: underline; text-decoration-color: rgba(241,232,212,.25); text-underline-offset: 3px; }
.person:hover { text-decoration-color: var(--brass); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; color: var(--dust); padding: 3px 9px; border-radius: 6px; background: rgba(241,232,212,.05); }
button.tag:hover { color: var(--vellum); background: rgba(241,232,212,.1); }
.files { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.file { display: flex; gap: 10px; align-items: center; padding: 9px 10px 9px 12px; border-radius: 10px; background: rgba(241,232,212,.04); border: 1px solid var(--line); }
.file__name { flex: 1; min-width: 0; font-size: 13.5px; color: #d9d2c2; overflow-wrap: anywhere; }
.rating { display: flex; align-items: baseline; gap: 10px; }
.rating__num { font: 600 30px/1 var(--serif); }
.rating__bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(241,232,212,.1); position: relative; top: -6px; }
.rating__bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--brass); }
.rating__votes { color: var(--dust); font-size: 13px; }

.near { list-style: none; margin: 0; padding: 0; }
.near__item { display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px 6px; border-radius: 10px; text-align: left; }
.near__item:hover { background: rgba(241, 232, 212, 0.06); }
.near__rank { width: 20px; flex: none; text-align: right; color: var(--faint); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.near__img { width: 38px; aspect-ratio: 2/3; flex: none; border-radius: 3px; object-fit: cover; background: var(--night-3); }
.near__text { flex: 1; min-width: 0; }
.near__title { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.25; }
.near__title small { color: var(--dust); font-weight: 400; font-size: 14px; margin-left: 4px; }
.near__why { display: block; color: var(--dust); font-size: 13.5px; line-height: 1.35; margin-top: 2px; }
.near__score { width: 44px; flex: none; text-align: right; font-variant-numeric: tabular-nums; color: var(--dust); font-size: 13px; }
.near__score i { display: block; height: 2px; margin-top: 5px; border-radius: 1px; background: currentColor; opacity: .7; }
.attribution { margin: 34px 24px 28px; color: var(--faint); font-size: 12.5px; }

/* ---------- drawer ---------- */
.drawer__tabs { display: flex; gap: 0; padding: 12px 52px 0 12px; overflow-x: auto; scrollbar-width: none; flex: none; }
.drawer__tabs::-webkit-scrollbar { display: none; }
.drawer__tab { padding: 7px 9px; border-radius: 9px; color: var(--dust); font-weight: 500; font-size: 14.5px; white-space: nowrap; }
.drawer__tab:hover { color: var(--vellum); }
.drawer__tab[aria-selected="true"] { color: var(--vellum); background: rgba(241,232,212,.1); }
.drawer__body { padding: 8px 22px 30px; }
.drawer h2 { margin: 16px 0 6px; font: 600 32px/1.05 var(--serif); }
.drawer h3 { margin: 26px 0 10px; font: italic 500 22px/1.15 var(--serif); }
.drawer p { color: #d9d2c2; margin: 8px 0; line-height: 1.55; }
.muted { color: var(--dust) !important; }
.regions { list-style: none; margin: 10px 0 0; padding: 0; }
.region { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 12px; align-items: baseline; width: 100%; padding: 10px 8px; border-radius: 10px; text-align: left; }
.region:hover { background: rgba(241,232,212,.06); }
.region .swatch { width: 11px; height: 11px; position: relative; top: 1px; }
.region__name { font: italic 600 20px/1.15 var(--serif); }
.region__n { color: var(--dust); font-variant-numeric: tabular-nums; font-size: 14px; }
.region__line { grid-column: 2 / 4; color: var(--dust); font-size: 13.5px; line-height: 1.35; }
.field { margin: 18px 0 0; }
.field__label { display: block; margin-bottom: 8px; color: var(--dust); font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.lens-legend { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--dust); font-size: 13px; }
.lens-legend i { flex: 1; height: 6px; border-radius: 3px; }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row input[type=range] { flex: 1; accent-color: var(--brass); }
.range-row output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
.grid-films { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 16px 12px; margin-top: 14px; }
.card-film { display: block; text-align: left; }
.card-film img, .card-film .ph { width: 100%; aspect-ratio: 2/3; border-radius: 5px; object-fit: cover; background: var(--night-3); display: block; box-shadow: 0 0 0 1px rgba(241,232,212,.08); }
.card-film .ph { display: grid; place-items: center; padding: 8px; font: italic 500 15px/1.2 var(--serif); color: var(--dust); text-align: center; }
.card-film:hover img { box-shadow: 0 0 0 2px var(--brass); }
.card-film span { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.25; font-weight: 600; }
.card-film small { color: var(--dust); font-weight: 400; }
.select { background: var(--night-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; margin-top: 16px; }
.stat__num { display: block; font: 600 34px/1 var(--serif); }
.stat__label { display: block; color: var(--dust); font-size: 14px; margin-top: 4px; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.bars li { display: grid; grid-template-columns: 1fr 34px; gap: 2px 10px; align-items: center; font-size: 14px; }
.bars li button { text-align: left; }
.bars i { grid-column: 1 / 2; display: block; height: 3px; border-radius: 2px; background: rgba(241,232,212,.5); }
.bars span.n { color: var(--dust); text-align: right; font-variant-numeric: tabular-nums; }
.plain-list { margin: 0; padding: 0 0 0 18px; color: #d9d2c2; }
.plain-list li { margin: 4px 0; }
.tmdb { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.tmdb svg { width: 78px; height: auto; flex: none; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; color: #d9d2c2; font-size: 14.5px; }
.keys kbd { font: 600 12px/1 var(--sans); border: 1px solid var(--line-strong); border-radius: 5px; padding: 4px 7px; color: var(--vellum); justify-self: start; }

/* ---------- tooltip, toast, notices ---------- */
.tip {
  position: fixed; z-index: 35; pointer-events: none;
  display: flex; gap: 11px; align-items: center;
  max-width: 300px; padding: 8px 12px 8px 8px;
  background: var(--glass-strong);
  border: 1px solid var(--line-strong); border-radius: 11px;
  box-shadow: 0 12px 30px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.tip[hidden] { display: none; }
.tip img { width: 40px; aspect-ratio: 2/3; border-radius: 3px; object-fit: cover; background: var(--night-3); flex: none; }
.tip b { display: block; font-weight: 600; line-height: 1.2; }
.tip span { display: block; color: var(--dust); font-size: 13px; margin-top: 2px; }
.toast {
  position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); z-index: 60;

<script src="data/movies.js" charset="utf-8"></script>
<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ basics
  const DATA = window.MOVIE_MAP_DATA;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const nf = new Intl.NumberFormat('en');
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const still = () => motionQuery.matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('lumiere.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lumiere.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  if (!DATA || !Array.isArray(DATA.films) || !DATA.films.length) {
    document.body.classList.remove('intro');
    document.body.insertAdjacentHTML('beforeend', '<div class="notice"><div><h1>The map has no data yet</h1><p>The file data/movies.js is missing or empty. Run update.cmd in the project folder to build it, then reload this page.</p></div></div>');
    return;
  }

  const meta = DATA.meta || {};
  const IMG = meta.images || 'https://image.tmdb.org/t/p/';
  const img = (path, size) => (path ? IMG + size + path : '');

  // ------------------------------------------------------------------ colour (OKLab)
  const toLin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const toGamma = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
  function rgbToLab(r, g, b) {
    r = toLin(r / 255); g = toLin(g / 255); b = toLin(b / 255);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
  }
  function labToRgb(lab) {
    const [L, a, b] = lab;
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.291485548 * b, 3);
    const out = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
    return out.map((c) => Math.round(clamp(toGamma(clamp(c, 0, 1)), 0, 1) * 255));
  }
  const hexToLab = (hex) => { const n = parseInt(hex.slice(1), 16); return rgbToLab((n >> 16) & 255, (n >> 8) & 255, n & 255); };
  const rgbHex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  const labHex = (lab) => rgbHex(labToRgb(lab));
  const lch = (L, C, h) => [L, C * Math.cos(h * Math.PI / 180), C * Math.sin(h * Math.PI / 180)];
  const mixLab = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const NEUTRAL = lch(0.74, 0.02, 250);
  function ramp(stops, t) {
    t = clamp(t, 0, 1) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(t));
    const a = stops[i], b = stops[i + 1], u = t - i;
    let dh = b[2] - a[2];
    if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
    return lch(lerp(a[0], b[0], u), lerp(a[1], b[1], u), a[2] + dh * u);
  }

  // ------------------------------------------------------------------ data
  const GENRES = meta.genres || [];
  const LANGS = meta.languages || {};
  const clusters = (DATA.clusters || []).map((c, i) => ({ ...c, i, lab: hexToLab(c.color), films: [] }));
  const films = DATA.films.map((f, i) => ({
    ...f, i, x: f.xy[0], y: f.xy[1],
    gn: (f.g || []).map((g) => GENRES[g]).filter(Boolean),
    year: f.y || null,
    pass: true, alpha: 1, lab: NEUTRAL, sprite: null,
  }));
  const byId = new Map(films.map((f) => [f.id, f]));
  const maxLogVotes = Math.max(1, ...films.map((f) => Math.log1p(f.vc || 0)));
  const kwCount = new Map();
  for (const f of films) {
    f.nb = (f.n || []).map((id) => byId.get(id)).filter(Boolean);
    f.weight = Math.log1p(f.vc || 0) / maxLogVotes;
    f.home = f.m && f.m.length ? clusters[f.m[0][0]] : null;
    if (f.home && f.m[0][1] >= 0.5) f.home.films.push(f);
    for (const k of f.k || []) kwCount.set(k, (kwCount.get(k) || 0) + 1);
  }
  const years = films.map((f) => f.year).filter(Boolean);
  const Y0 = Math.min(...years), Y1 = Math.max(...years);
  const since = meta.since || '';
  const isNew = (f) => !!(since && f.a && f.a > since);
  const hasNew = films.some(isNew);

  // world bounds
  let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
  for (const f of films) { bx0 = Math.min(bx0, f.x); bx1 = Math.max(bx1, f.x); by0 = Math.min(by0, f.y); by1 = Math.max(by1, f.y); }
  const span = Math.max(bx1 - bx0, by1 - by0) || 1;

  // ------------------------------------------------------------------ colour lenses
  const langOrder = [...films.reduce((m, f) => m.set(f.l, (m.get(f.l) || 0) + 1), new Map())]
    .sort((a, b) => b[1] - a[1]).map((e) => e[0]);
  const LANG_HUES = [28, 330, 150, 210, 95, 265, 185, 0, 120, 300, 55, 235];
  const langLab = new Map();
  let hueIx = 0;
  for (const code of langOrder) {
    if (code === 'en') langLab.set(code, lch(0.8, 0.025, 250));
    else if (hueIx < LANG_HUES.length) langLab.set(code, lch(hueIx % 2 ? 0.74 : 0.8, 0.14, LANG_HUES[hueIx++]));
    else langLab.set(code, lch(0.6, 0.03, 250));
  }
  const DECADE_STOPS = [[0.58, 0.13, 300], [0.68, 0.14, 245], [0.77, 0.13, 190], [0.84, 0.14, 120], [0.88, 0.15, 85]];
  const RATING_STOPS = [[0.55, 0.04, 255], [0.67, 0.09, 230], [0.8, 0.13, 160], [0.88, 0.15, 85]];
  const LENSES = {
    region: { name: 'Regions', lab: (f) => {
      if (!f.m || !f.m.length) return NEUTRAL;
      let L = 0, A = 0, B = 0, W = 0;
      for (const [ci, w] of f.m) { const c = clusters[ci].lab; L += c[0] * w; A += c[1] * w; B += c[2] * w; W += w; }
      return [L / W, A / W, B / W];
    } },
    decade: { name: 'Decade', lab: (f) => (f.year ? ramp(DECADE_STOPS, Math.pow((f.year - Y0) / Math.max(1, Y1 - Y0), 1.6)) : NEUTRAL) },
    rating: { name: 'TMDB rating', lab: (f) => ((f.vc || 0) >= 25 ? ramp(RATING_STOPS, (f.va - 5.8) / 2.7) : lch(0.5, 0.01, 250)) },
    language: { name: 'Language', lab: (f) => langLab.get(f.l) || NEUTRAL },
  };
  let lens = store.get('lens', 'region');
  if (!LENSES[lens]) lens = 'region';

  // ------------------------------------------------------------------ canvas and camera
  const canvas = $('#map');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, kFit = 1;
  const cam = { x: (bx0 + bx1) / 2, y: (by0 + by1) / 2, k: 1 };
  const isNarrow = () => W <= 760;

  function viewInsets() {
    // the part of the screen not covered by open panels
    const ins = { l: 0, r: 0, t: 0, b: 0 };
    if (isNarrow()) {
      if (ui.detailOpen || ui.drawerOpen) ins.b = Math.min(H * 0.62, 640) + 10;
      ins.t = 70; ins.b = Math.max(ins.b, 140);
    } else {
      if (ui.detailOpen) ins.r = Math.min(460, W - 24) + 12;
      if (ui.drawerOpen) ins.l = Math.min(400, W - 24) + 12;
      ins.t = 90; ins.b = 80;
    }
    return ins;
  }
  function fitScale(x0, y0, x1, y1, ins) {
    const w = Math.max(1, W - ins.l - ins.r - 40), h = Math.max(1, H - ins.t - ins.b - 30);
    return Math.min(w / Math.max(1e-6, x1 - x0), h / Math.max(1e-6, y1 - y0));
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const first = W === 0;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const ins = isNarrow() ? { l: 0, r: 0, t: 90, b: 150 } : { l: 0, r: 0, t: 110, b: 90 };
    kFit = fitScale(bx0, by0, bx1, by1, ins);
    if (first) homeCamera(false);
    buildNebulaCanvas();
    requestDraw();
  }
  const sx = (x) => (x - cam.x) * cam.k + W / 2;
  const sy = (y) => (y - cam.y) * cam.k + H / 2;
  const wx = (px) => (px - W / 2) / cam.k + cam.x;
  const wy = (py) => (py - H / 2) / cam.k + cam.y;
  const zoomLevel = () => cam.k / kFit;

  function homeCamera(animate = true) {
    const ins = viewInsets();
    const k = fitScale(bx0, by0, bx1, by1, ins);
    const cx = (bx0 + bx1) / 2 + (ins.r - ins.l) / 2 / k;
    const cy = (by0 + by1) / 2 + (ins.b - ins.t) / 2 / k;
    flyTo(cx, cy, k, animate ? 900 : 0);
  }
  function fitFilms(list, animate = true, maxZoom = 7) {
    if (!list.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const f of list) { x0 = Math.min(x0, f.x); x1 = Math.max(x1, f.x); y0 = Math.min(y0, f.y); y1 = Math.max(y1, f.y); }
    const pad = span * 0.03;
    x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const ins = viewInsets();
    const k = clamp(fitScale(x0, y0, x1, y1, ins), kFit * 0.8, kFit * maxZoom);
    const cx = (x0 + x1) / 2 + (ins.r - ins.l) / 2 / k;
    const cy = (y0 + y1) / 2 + (ins.b - ins.t) / 2 / k;
    flyTo(cx, cy, k, animate ? 1100 : 0);
  }

  // camera animation: zooms out a little on long trips so the eye can follow
  let flight = null;
  function flyTo(x, y, k, ms = 1000) {
    k = clamp(k, kFit * 0.5, kFit * 60);
    if (still() || ms === 0) { cam.x = x; cam.y = y; cam.k = k; flight = null; requestDraw(); return; }
    const from = { ...cam };
    const dist = Math.hypot(x - from.x, y - from.y) * Math.min(from.k, k);
    const dip = clamp(dist / Math.max(W, H) - 0.4, 0, 1.2);
    flight = { from, to: { x, y, k }, t0: performance.now(), ms: ms * (1 + dip * 0.25), dip };
    requestDraw();
  }
  function stepFlight(now) {
    if (!flight) return false;
    const t = clamp((now - flight.t0) / flight.ms, 0, 1);
    const e = easeInOut(t);
    const { from, to, dip } = flight;
    cam.x = lerp(from.x, to.x, e);
    cam.y = lerp(from.y, to.y, e);
    const lk = lerp(Math.log(from.k), Math.log(to.k), e) - dip * 0.9 * Math.sin(Math.PI * t);
    cam.k = Math.exp(lk);
    if (t >= 1) flight = null;
    return true;
  }
  function zoomAt(px, py, factor) {
    const k = clamp(cam.k * factor, kFit * 0.5, kFit * 60);
    const x = wx(px), y = wy(py);
    cam.k = k;
    cam.x = x - (px - W / 2) / k;
    cam.y = y - (py - H / 2) / k;
    flight = null;
    requestDraw();
  }

  // ------------------------------------------------------------------ the coloured field behind the films
  let nebula = null; // { canvas, x0, y0, x1, y1 }
  function buildNebulaCanvas() {
    const pad = span * 0.16;
    const x0 = bx0 - pad, y0 = by0 - pad, x1 = bx1 + pad, y1 = by1 + pad;
    const G = isNarrow() ? 220 : 300;
    const gw = Math.round((x1 - x0) >= (y1 - y0) ? G : G * (x1 - x0) / (y1 - y0));

    const off = ps ? ps / 2 + 6 : 9;
    const spots = ps ? [[x - w / 2, y + off + 7, 'left']] : [[x + off, y, 'left'], [x - off - w, y, 'left'], [x - w / 2, y - off - 4, 'left'], [x - w / 2, y + off + 4, 'left']];
    for (const [lx, ly] of spots) {
      const r = { x: lx - 3, y: ly - size * 0.7, w: w + 6, h: size * 1.4 };
      if (r.x < 2 || r.x + r.w > W - 2 || r.y < 2 || r.y + r.h > H - 2) continue;
      if (hits(r) && !(force && f === state.selected)) continue;
      occupied.push(r);
      ctx.textAlign = 'left';
      ctx.globalAlpha = alpha * (f.pass ? 1 : 0.5);
      if (ps) { ctx.fillStyle = 'rgba(8,13,27,.78)'; roundRect(r.x - 2, r.y + 1, r.w + 4, r.h - 2, 5); ctx.fill(); }
      else {
        ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(5,9,20,.82)';
        ctx.strokeText(text, lx, ly);
      }
      ctx.fillStyle = f === state.selected ? '#ffffff' : (force ? '#f1e8d4' : 'rgba(241,232,212,.86)');
      ctx.fillText(text, lx, ly);
      return true;
    }
    return false;
  }

  // ------------------------------------------------------------------ pointer and keyboard
  const pointers = new Map();
  let drag = null, pinch = null, inertia = null, lastTap = 0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);

    if (pointers.size === 1) {

    } else if (pointers.size === 2) {

    const p = pointers.get(e.pointerId);

    if (e.type === 'pointercancel') return;

      const now = performance.now();

      lastTap = now;
      if (f) choose(f);

    } else if (!still() && Math.hypot(d.vx, d.vy) > 0.25) {

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // hover tooltip
  const tip = $('#tip');
  function hover(f, x, y) {

    tip.innerHTML = `${f.p ? `<img alt="" src="${img(f.p, 'w92')}">` : ''}<div><b>${esc(f.t)}</b><span>${esc([f.year, who].filter(Boolean).join(', '))}</span></div>`;

  }
  function hideTip() { tip.hidden = true; }

  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);

      if (state.pathFrom) { state.pathFrom = null; renderBanner(); requestDraw(); return; }
      if (ui.detailOpen) { closeDetail(); return; }
      if (ui.drawerOpen) { closeDrawer(); return; }

    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

  $('#zoom-fit').addEventListener('click', () => homeCamera());
  $('#shuffle').addEventListener('click', shuffle);
  function shuffle() {
    const pool = films.filter((f) => f.pass && f !== state.selected);
    if (!pool.length) return;
    select(pool[Math.floor(Math.random() * pool.length)]);
  }

  // ------------------------------------------------------------------ selection and the detail panel
  function choose(f) {

  function openDetail() {

  function whyClose(a, b) {
    const same = (x, y) => (x || []).filter((v) => (y || []).includes(v));
    const d = same(a.dir, b.dir);
    if (d.length) return `Both directed by ${d[0]}`;
    if (a.col && a.col === b.col) return `Both in ${a.col}`;
    const w = same(a.wri, b.wri);
    const kw = same(a.k, b.k).sort((x, y) => (kwCount.get(x) || 0) - (kwCount.get(y) || 0));
    const c = same(a.cast, b.cast);
    const bits = [];
    if (w.length) bits.push(`written by ${w[0]}`);
    if (c.length) bits.push(`with ${c.slice(0, 2).join(' and ')}`);
    if (kw.length) bits.push(`common themes: ${kw.slice(0, 3).join(', ')}`);
    if (!bits.length) {
      const g = same(a.gn, b.gn).map((x) => x.toLowerCase());
      const lang = a.l === b.l && a.l !== 'en' ? `in ${LANGS[a.l] || a.l}` : '';
      if (g.length) bits.push(`both ${g.slice(0, 2).join(' and ')}${lang ? ', ' + lang : ''}`);
      else if (lang) bits.push(`both ${lang}`);

    return s ? s[0].toUpperCase() + s.slice(1) : 'Close in tone and era';
  }

  const personLink = (name) => `<button type="button" class="person" data-person="${esc(name)}">${esc(name)}</button>`;
  const people = (list) => list.map(personLink).join(', ');
  function hrs(min) { if (!min) return ''; const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${m ? m + ' min' : ''}`.trim() : `${m} min`; }

  function renderDetail(f) {
    const regions = (f.m || []).filter((m) => m[1] >= 0.15).map(([ci, w]) => clusters[ci]);

      `<a class="chip" href="https://www.themoviedb.org/movie/${f.id}" target="_blank" rel="noopener">TMDB</a>`,

      f.tr ? `<a class="chip" href="https://www.youtube.com/watch?v=${esc(f.tr)}" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>Trailer</a>` : '',
    ].join('');

      f.wri && f.wri.length ? `<dt>Written by</dt><dd>${people(f.wri)}</dd>` : '',
      f.dop && f.dop.length ? `<dt>Photographed by</dt><dd>${people(f.dop)}</dd>` : '',
      f.mus && f.mus.length ? `<dt>Music by</dt><dd>${people(f.mus)}</dd>` : '',
      f.cast && f.cast.length ? `<dt>Starring</dt><dd>${people(f.cast.slice(0, 8))}</dd>` : '',
      f.c && f.c.length ? `<dt>From</dt><dd>${esc(f.c.map(countryName).join(', '))}</dd>` : '',

    ].join('');

      <div class="film__hero">
        <div class="film__backdrop" id="backdrop"></div>
        <div class="film__head">

          <div class="film__titles">
            <h2 class="film__title" id="film-title" tabindex="-1">${esc(f.t)}</h2>
            ${f.o ? `<p class="film__original${/[^\u0000-ɏḀ-ỿ]/.test(f.o.replace(/[\s\p{P}\p{S}\p{N}]/gu, '')) ? ' is-script' : ''}" lang="${esc(f.l === 'cn' ? 'zh-yue' : f.l)}">${esc(f.o)}</p>` : ''}
          </div>
        </div>
      </div>
      <ul class="film__facts">${facts.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      ${f.dir && f.dir.length ? `<p class="film__credit"><span>Directed by</span> ${people(f.dir)}</p>` : ''}
      ${f.tg ? `<p class="film__tagline">${esc(f.tg)}</p>` : ''}
      ${f.ov ? `<p class="film__overview">${esc(f.ov)}</p>` : ''}
      <div class="film__actions">
        ${regions.map((c) => `<button type="button" class="chip" data-region="${c.id}"><span class="swatch" style="color:${c.color};background:${c.color}"></span>${esc(c.name)}</button>`).join('')}
        ${f.gn.map((g) => `<button type="button" class="chip" data-genre="${esc(g)}" aria-pressed="${filters.genres.has(g)}">${esc(g)}</button>`).join('')}
      </div>
      <section class="section">
        <h3 class="section__title">The ${f.nb.length} nearest films</h3>
        <p class="section__note">Ranked by how much they share: people, themes, genre, language and era.</p>
        <ol class="near">${near}</ol>
        <div class="film__actions" style="margin:12px 0 0"><button type="button" class="chip" data-pathfrom="${f.id}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M7.5 16.5C10 14 9 10 12 9s4.5-1 5-1.5"/></svg>Trace a path to another film</button></div>
      </section>

    }
  }
  let regionNames = null;
  function countryName(code) {
    try { regionNames = regionNames || new Intl.DisplayNames(['en'], { type: 'region' }); return regionNames.of(code) || code; } catch (e) { return code; }
  }

  // clicks inside panels
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-film],[data-person],[data-theme],[data-region],[data-genre],[data-copy],[data-pathfrom],[data-close],[data-tab],[data-lens],[data-lang],[data-runtime],[data-clear],[data-new],[data-sort]');
    if (!t) return;
    const d = t.dataset;
    if (d.film) { const f = byId.get(+d.film); if (f) { if (isNarrow() && ui.drawerOpen) closeDrawer(true); choose(f); } }
    else if (d.person) spotlightPerson(d.person);
    else if (d.theme) spotlightTheme(d.theme);
    else if (d.region) spotlightRegion(d.region);
    else if (d.genre) { toggleSet(filters.genres, d.genre); applyFilters(); if (ui.detailOpen && state.selected) renderDetail(state.selected); if (ui.drawerOpen && ui.tab === 'filters') renderDrawer(); }

    else if (d.close === 'detail') closeDetail();
    else if (d.close === 'drawer') closeDrawer();

    else if (d.lang) { toggleSet(filters.langs, d.lang); applyFilters(); renderDrawer(); }

    else if (d.new) { filters.onlyNew = !filters.onlyNew; applyFilters(); renderDrawer(); }

  const toggleSet = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));
  function clearFilters() {

    filters.minRating = 0; filters.runtime = 'any'; filters.onlyNew = false;

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast('File name copied'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('File name copied'); } catch (err) { toast('Copy failed; select the name instead'); }
      ta.remove();

  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('is-on'), 2200);
  }

  // ------------------------------------------------------------------ spotlights: people, themes, regions, paths
  const peopleIndex = new Map();
  for (const f of films) {
    const add = (name, role) => {
      if (!name) return;
      let p = peopleIndex.get(name);
      if (!p) peopleIndex.set(name, (p = { name, films: new Set(), roles: new Map() }));
      p.films.add(f); p.roles.set(role, (p.roles.get(role) || 0) + 1);
    };
    (f.dir || []).forEach((n) => add(n, 'director'));
    (f.wri || []).forEach((n) => add(n, 'writer'));
    (f.cast || []).forEach((n) => add(n, 'actor'));
    (f.dop || []).forEach((n) => add(n, 'cinematographer'));
    (f.mus || []).forEach((n) => add(n, 'composer'));
  }
  const themeIndex = new Map();
  for (const f of films) for (const k of f.k || []) { if (!themeIndex.has(k)) themeIndex.set(k, new Set()); themeIndex.get(k).add(f); }
  const roleText = (p) => [...p.roles.entries()].sort((a, b) => b[1] - a[1]).map((r) => r[0]).slice(0, 2).join(' and ');

  function spotlight(kind, label, set, hash, color) {
    const ordered = [...set].sort((a, b) => (a.year || 0) - (b.year || 0));
    state.spot = { kind, label, films: set, ordered: kind === 'person' ? ordered : [], hash, color };
    state.path = null;
    if (state.selected && !set.has(state.selected)) closeDetail();
    renderBanner();
    fitFilms(ordered, true, 6);
    setHash(hash);
    requestDraw();
  }
  function spotlightPerson(name) {
    const p = peopleIndex.get(name);
    if (!p) return;
    if (isNarrow()) { closeDetail(); closeDrawer(true); }
    spotlight('person', `<b>${esc(name)}</b>, ${p.films.size} film${p.films.size > 1 ? 's' : ''} as ${roleText(p)}`, p.films, 'person/' + encodeURIComponent(name));
  }
  function spotlightTheme(k) {
    const set = themeIndex.get(k);
    if (!set) return;
    if (isNarrow()) { closeDetail(); closeDrawer(true); }
    spotlight('theme', `Theme <b>${esc(k)}</b>, ${set.size} film${set.size > 1 ? 's' : ''}`, set, 'theme/' + encodeURIComponent(k));
  }
  function spotlightRegion(id) {

    const maxD = dirs.length ? dirs[0].n : 1, maxA = actors.length ? actors[0].n : 1;
    const langs = langOrder.slice(0, 8).map((c) => [c, films.filter((f) => f.l === c).length]);
    const recent = films.filter((f) => f.a).sort((a, b) => (b.a || '').localeCompare(a.a || '')).slice(0, 8);
    return `<h2>The collection</h2>
      <div class="stats">
        <div><span class="stat__num">${nf.format(films.length)}</span><span class="stat__label">films on the map</span></div>
        <div><span class="stat__num">${nf.format(Math.round(minutes / 60))}</span><span class="stat__label">hours, or ${Math.round(minutes / 1440)} days without sleep</span></div>
        <div><span class="stat__num">${langCount}</span><span class="stat__label">original languages</span></div>
        <div><span class="stat__num">${countries}</span><span class="stat__label">countries of origin</span></div>
        <div><span class="stat__num">${Y0}</span><span class="stat__label">the oldest film</span></div>
        <div><span class="stat__num">${clusters.length}</span><span class="stat__label">regions</span></div>
      </div>
      ${dirs.length ? `<h3>Most collected directors</h3><ul class="bars">${dirs.map((d) => `<li><button type="button" class="person" data-person="${esc(d.p.name)}">${esc(d.p.name)}</button><span class="n">${d.n}</span><i style="width:${d.n / maxD * 100}%"></i></li>`).join('')}</ul>` : ''}
      ${actors.length ? `<h3>Faces that keep returning</h3><ul class="bars">${actors.map((d) => `<li><button type="button" class="person" data-person="${esc(d.p.name)}">${esc(d.p.name)}</button><span class="n">${d.n}</span><i style="width:${d.n / maxA * 100}%"></i></li>`).join('')}</ul>` : ''}
      <h3>Languages</h3><ul class="bars">${langs.map(([c, n]) => `<li><button type="button" data-lang="${esc(c)}">${esc(LANGS[c] || c)}</button><span class="n">${n}</span><i style="width:${n / langs[0][1] * 100}%"></i></li>`).join('')}</ul>
      ${hasNew ? `<h3>Recently added</h3><ul class="plain-list">${recent.filter(isNew).map((f) => `<li><button type="button" class="person" data-film="${f.id}">${esc(f.t)}</button> <span class="muted">${f.year || ''}</span></li>`).join('')}</ul>` : ''}
      <p class="muted" style="margin-top:22px">Map drawn ${esc(fmtDate(meta.built))}.</p>`;
  }
  const TMDB_LOGO = '<svg viewBox="0 0 190.24 81.52" role="img" aria-label="TMDB"><defs><linearGradient id="tmdb-g" y1="40.76" x2="190.24" y2="40.76" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#90cea1"/><stop offset="0.56" stop-color="#3cbec9"/><stop offset="1" stop-color="#00b3e5"/></linearGradient></defs><path fill="url(#tmdb-g)" d="M105.67,36.06h66.9A17.67,17.67,0,0,0,190.24,18.4h0A17.67,17.67,0,0,0,172.57.73h-66.9A17.67,17.67,0,0,0,88,18.4h0A17.67,17.67,0,0,0,105.67,36.06Zm-88,45h76.9A17.67,17.67,0,0,0,112.24,63.4h0A17.67,17.67,0,0,0,94.57,45.73H17.67A17.67,17.67,0,0,0,0,63.4H0A17.67,17.67,0,0,0,17.67,81.06ZM10.41,35.42h7.8V6.92h10.1V0H.31v6.9h10.1Zm28.1,0h7.8V8.25h.1l9,27.15h6l9.3-27.15h.1V35.4h7.8V0H66.76l-8.2,23.1h-.1L50.31,0H38.51ZM152.43,55.67a15.07,15.07,0,0,0-4.52-5.52,18.57,18.57,0,0,0-6.68-3.08,33.54,33.54,0,0,0-8.07-1h-11.7v35.4h12.75a24.58,24.58,0,0,0,7.55-1.15A19.34,19.34,0,0,0,148.11,77a16.27,16.27,0,0,0,4.37-5.5,16.91,16.91,0,0,0,1.63-7.58A18.5,18.5,0,0,0,152.43,55.67ZM145,68.6A8.8,8.8,0,0,1,142.36,72a10.7,10.7,0,0,1-4,1.82,21.57,21.57,0,0,1-5,.55h-4.05v-21h4.6a17,17,0,0,1,4.67.63,11.66,11.66,0,0,1,3.88,1.87A9.14,9.14,0,0,1,145,59a9.87,9.87,0,0,1,1,4.52A11.89,11.89,0,0,1,145,68.6Zm44.63-.13a8,8,0,0,0-1.58-2.62A8.38,8.38,0,0,0,185.63,64a10.31,10.31,0,0,0-3.17-1v-.1a9.22,9.22,0,0,0,4.42-2.82,7.43,7.43,0,0,0,1.68-5,8.42,8.42,0,0,0-1.15-4.65,8.09,8.09,0,0,0-3-2.72,12.56,12.56,0,0,0-4.18-1.3,32.84,32.84,0,0,0-4.62-.33h-13.2v35.4h14.5a22.41,22.41,0,0,0,4.72-.5,13.53,13.53,0,0,0,4.28-1.65,9.42,9.42,0,0,0,3.1-3,8.52,8.52,0,0,0,1.2-4.68A9.39,9.39,0,0,0,189.66,68.47ZM170.21,52.72h5.3a10,10,0,0,1,1.85.18,6.18,6.18,0,0,1,1.7.57,3.39,3.39,0,0,1,1.22,1.13,3.22,3.22,0,0,1,.48,1.82,3.63,3.63,0,0,1-.43,1.8,3.4,3.4,0,0,1-1.12,1.2,4.92,4.92,0,0,1-1.58.65,7.51,7.51,0,0,1-1.77.2h-5.65Zm11.72,20a3.9,3.9,0,0,1-1.22,1.3,4.64,4.64,0,0,1-1.68.7,8.18,8.18,0,0,1-1.82.2h-7v-8h5.9a15.35,15.35,0,0,1,2,.15,8.47,8.47,0,0,1,2.05.55,4,4,0,0,1,1.57,1.18,3.11,3.11,0,0,1,.63,2A3.71,3.71,0,0,1,181.93,72.72Z"/></svg>';
  function aboutHtml() {
    return `<h2>About this map</h2>
      <p>Every film in the collection is a point of light. Two films sit close together when they share a lot: the people who made them and act in them, their themes, genres, original language, era and pace. Nothing is placed by hand.</p>
      <p>The coloured regions are groups found from each film's full details. Pick a film to see its twenty nearest films and what links them, search for a director or actor to light up their work, or trace a path between any two films.</p>
      <h3>Getting around</h3>
      <div class="keys">
        <kbd>/</kbd><span>Search</span>
        <kbd>R</kbd><span>A random film</span>
        <kbd>F</kbd><span>Show the whole map</span>
        <kbd>+ −</kbd><span>Zoom in and out (or scroll, or pinch)</span>
        <kbd>Esc</kbd><span>Close the open panel</span>
      </div>
      <p class="muted" style="margin-top:12px">Zoom in far enough and the points turn into posters. Links to a film (and to people, themes and paths) can be shared: the address bar always describes what you are looking at.</p>
      <h3>Credits</h3>
      <div class="tmdb">${TMDB_LOGO}<p class="muted" style="margin:0">This product uses the TMDB API but is not endorsed or certified by TMDB. Film details, posters and backdrops come from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">The Movie Database</a>.</p></div>
      <p class="muted">Type set in Cormorant and Sofia Sans.</p>`;
  }

  // ------------------------------------------------------------------ bottom sheets on small screens: drag the grip
  for (const grip of $$('[data-grip]')) {
    let startY = 0, startH = 0, panel = null;
    grip.addEventListener('pointerdown', (e) => { panel = grip.closest('.panel'); startY = e.clientY; startH = panel.getBoundingClientRect().height; grip.setPointerCapture(e.pointerId); panel.style.transition = 'none'; });
    grip.addEventListener('pointermove', (e) => { if (!panel) return; const dy = e.clientY - startY; panel.style.transform = dy > 0 ? `translateY(${dy}px)` : 'none'; if (dy < -40) panel.classList.add('is-tall'); });
    grip.addEventListener('pointerup', (e) => {
      if (!panel) return;
      const dy = e.clientY - startY;
      panel.style.transition = ''; panel.style.transform = '';
      if (dy > 120) { if (panel.id === 'detail') closeDetail(); else closeDrawer(); }
      else if (Math.abs(dy) < 6) panel.classList.toggle('is-tall');
      panel = null;
    });
  }

  // ------------------------------------------------------------------ addresses: #film/ID, #person/NAME, #theme/WORD, #region/ID, #path/A-B
  let ignoreHash = false;
  function setHash(h) {
    const want = h ? '#' + h : '';
    if (location.hash === want || (!want && !location.hash)) return;
    ignoreHash = true;
    if (want) location.hash = h;
    else history.replaceState(null, '', location.pathname + location.search);
    setTimeout(() => { ignoreHash = false; }, 0);
  }
  function route() {
    if (ignoreHash) return;
    const h = decodeURIComponent(location.hash.slice(1));
    const [kind, ...rest] = h.split('/');
    const arg = rest.join('/');
    if (kind === 'film' && byId.has(+arg)) select(byId.get(+arg));
    else if (kind === 'person' && peopleIndex.has(arg)) spotlightPerson(arg);
    else if (kind === 'theme' && themeIndex.has(arg)) spotlightTheme(arg);
    else if (kind === 'region') spotlightRegion(arg);
    else if (kind === 'path') { const [a, b] = arg.split('-').map((x) => byId.get(+x)); if (a && b) showPath(a, b); }
    else if (!h) { if (ui.detailOpen) closeDetail(); if (state.spot || state.path) clearSpot(); }
  }
  window.addEventListener('hashchange', route);

  // ------------------------------------------------------------------ start
  document.title = meta.title || document.title;
  $('#brand-title').textContent = meta.title || 'Lumière';
  $('#brand-line').innerHTML = `<span class="brand__count">${nf.format(films.length)} films.</span> ${esc(meta.tagline || '')}`;
  applyLens(lens);
  resize();
  applyFilters();
  window.addEventListener('resize', () => { resize(); drawYears(); });
  motionQuery.addEventListener && motionQuery.addEventListener('change', requestDraw);
  if (!still()) { introT0 = performance.now(); }
  requestAnimationFrame(() => document.body.classList.remove('intro'));
  if (location.hash) setTimeout(route, still() ? 0 : 450);
  drawYears();
})();
</script>
